name: findfood_app
description: Premium local food delivery app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  google_sign_in: ^6.1.6   # FIX: 6.1.x uses GoogleSignIn() constructor (stable)
  image_picker: ^1.1.2      # NEW: for restaurant menu photo uploads
  web_socket_channel: ^2.4.5 # NEW: for live real-time chat

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true