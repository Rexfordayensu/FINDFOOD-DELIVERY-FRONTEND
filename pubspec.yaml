name: findfood_app
description: Premium local food delivery app

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  google_sign_in: ^6.1.6   # FIX: 6.1.x uses GoogleSignIn() constructor (stable)
  web_socket_channel: 3.0.3 # NEW: for live real-time chat
  image_picker: ^1.2.3      # NEW: for restaurant menu photo uploads
  url_launcher: ^6.1.7
  app_links: ^7.2.1
  flutter_secure_storage: ^10.3.1
  flutter_web_plugins:
    sdk: flutter
  go_router: 16.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true